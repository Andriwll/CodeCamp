<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8"><title>Preview | Build a Video Display Using iframe: Step 8 | freeCodeCamp.org</title><style>
      #fcc-main-frame {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style></head><body style="
        margin: 0px;
        padding: 0px;
        overflow: hidden;
      "><div><div class="notranslate challenge-preview enable-iframe"><iframe srcdoc="&lt;!DOCTYPE html&gt;
  &lt;base href='' /&gt;
  &lt;style class=&quot;fcc-hide-header&quot;&gt;
    head *, title, meta, link, script {
      display: none !important;
    }
  &lt;/style&gt;
  &lt;script&gt;
    window.__frameId = 'fcc-main-frame';
    window.onerror = function(msg) {
      const string = msg.toLowerCase();
      if (string.includes('script error')) {
        msg = 'Build error, open your browser console to learn more.';
      }
      console.log(msg);
      return true;
    };
    document.addEventListener('click', function(e) {
      let element = e.target;
      while(element &amp;&amp; element.nodeName !== 'A') {
        element = element.parentElement;
      }
      if (element &amp;&amp; element.nodeName === 'A' &amp;&amp; new URL(element.href).hash === '') {
        e.preventDefault();
        window.parent.window.alert(
          i18nContent.t('misc.iframe-alert', { externalLink: element.href })
        )
      }
      if (element) {
        const href = element.getAttribute('href');
        if (!href || href[0] !== '#' &amp;&amp; !href.match(/^https?:\/\//)) {
          e.preventDefault();
        }
        else if (href.match(/^#.+/)) {
          e.preventDefault();
          const scrollId = href.substring(1);
          window.location.hash = scrollId;
        }
      }
    }, false);
    document.addEventListener('submit', function(e) {
      const action = e.target.getAttribute('action');
      e.preventDefault();
      if (action &amp;&amp; action.match(/https?:\/\//)) {
        window.parent.window.alert(
          i18nContent.t('misc.iframe-form-submit-alert', { externalLink: action  })
        )
      }
    }, false);
  &lt;/script&gt;
&lt;head&gt;&lt;/head&gt;&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;title&gt;Display Videos in an iframe&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;iframe Video Display&lt;/h1&gt;

    &lt;/iframe&gt;
  
&lt;/body&gt;" id="fcc-main-frame" title="Display Videos in an iframe preview" lang="en" class="challenge-preview-frame"></iframe></div></div></body></html>
